<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="./submit.php">
        <div>
            <label for="name">Name</label>
            <input type="name" type="text" placeholder="Enter your name" required>
        </div>

        <div>
            <label for="phone">Phone</label>
            <input id="phone" type="tel" placeholder="Enter your number" required>
        </div>

        <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter your Email" required>
        </div>

        <div>
            <label for="password">password</label>
            <input id="password" type="password" placeholder="Enter your password" required>
        </div>

        <div>
            <label for="dob">Date-of-birth</label>
            <input id="dob" type="date" placeholder="Enter your date-of-birth" required>
        </div>

        <div>
            <label for="Gender">Gender</label>
            <select id="Gender" required>
                <option value="" disabled selected>Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="others">Others</option>
            </select>
        </div>

        <div>
            <p>Subscription Plan</p>
            <input type="radio" id="basic" name="subscription" value="basic">
            <label for="basic">Basic</label>

            <input type="radio" id="premium" name="subscription" value="premium">
            <label for="premium">Premium</label>

            <input type="radio" id="VIP" name="subscription" value="VIP">
            <label for="VIP">VIP</label>

        </div>

        <div>
            <input type="checkbox" id="terms" required>
            <label for="terms">I agree with the terms and condition</label> 
        </div>

        <div>
            <label for="comments">Comments</label>
            <textarea placeholder="Enter your comments" id="comments" rows="5"></textarea>
        </div>

        <div>
            <button>Submit</button>
        </div>
        
    </form>
</body>
</html>
